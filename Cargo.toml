[package]
name = "hurl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal-native API client"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
dirs = "6"
reqwest = { version = "0.13.2", default-features = false, features = ["charset", "http2", "json", "query", "rustls", "stream"] }
walkdir = "2.5.0"
serde_json = "1.0.149"
dotenvy = "0.15.7"
tokio-util = { version = "0.7.18", features = ["rt"] }
serde_json_path = "0.7"
similar = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
